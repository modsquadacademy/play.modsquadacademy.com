<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Squad Academy</title>
    <meta name="description" content="Welcome to the Mod. Squad Academy! Learn and enquire about our 2026 courses, discover awesome mods, or simply play some of our tutorial games!">
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="components.js" defer></script>
    <style>
        .looking-for-section { padding: 60px 20px; text-align: center; }
        
        .carousel-outer { 
            position: relative; max-width: 1200px; margin: 0 auto; overflow: hidden;
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        }

        #looking-carousel { 
            display: flex; gap: 20px; 
            will-change: transform;
            padding: 20px 0;
            justify-content: center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .looking-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 25px; 
            width: 85vw; max-width: 450px;
            flex-shrink: 0;
            display: flex; align-items: center; gap: 15px; text-decoration: none;
            transition: all 0.3s ease;
        }

        .looking-card.center-active {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .looking-card img { width: 45px; height: 45px; }
        .looking-text { text-align: left; }
        .looking-text h3 { color: #fff; margin: 0; font-size: 1.2rem; }
        .looking-text p { margin: 5px 0 0; font-weight: 600; font-size: 0.9rem; text-decoration: underline; }
    </style>
</head>
<body>
    
    <shared-header></shared-header>

    <main>
        <section class="display-section">
            <div class="display-content">
                <img src="images/favicon.png" alt="Mod Squad Icon" class="hero-favicon">
                <h1 class="display-title">Code to new worlds</h1>
                <h2 class="display-subtitle">NEVER SEEN BEFORE</h2>
                <a href="https://modsquadacademy.com/contact" class="btn-glass">Enquire Now!</a>
            </div>
        </section>
    </main>

    <shared-footer></shared-footer>

    <script>
        const carousel = document.getElementById('looking-carousel');
        function updateGlow() {
            const cards = Array.from(document.querySelectorAll('.looking-card'));
            cards.forEach(c => c.classList.remove('center-active'));
            if (cards.length >= 2) cards[1].classList.add('center-active');
        }
        function rotateCarousel() {
            const cards = Array.from(document.querySelectorAll('.looking-card'));
            const cardWidth = cards[0].offsetWidth;
            const gap = 20;
            carousel.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
            carousel.style.transform = `translateX(-${cardWidth + gap}px)`;
            setTimeout(() => {
                carousel.style.transition = 'none';
                carousel.appendChild(carousel.firstElementChild);
                carousel.style.transform = 'translateX(0)';
                updateGlow();
            }, 800);
        }
        if (carousel) {
            setInterval(rotateCarousel, 4000);
            updateGlow();
        }
    </script>
</body>
</html>
