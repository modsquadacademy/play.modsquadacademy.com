<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play & Share | Mod Squad Academy</title>
    <meta name="description" content="Play, share, and test projects created with Scratch, TurboWarp, PenguinMod, and Gandi IDE!">
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap" rel="stylesheet">
    
    <!-- Using your existing global stylesheet and components -->
    <link rel="stylesheet" href="/style.css">
    <script src="/components.js" defer></script>

    <style>
        /* Specific layout rules for the Play Arcade page */
        .arcade-section {
            padding: 60px 8%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 153, 255, 0.5);
            box-shadow: 0 8px 25px rgba(0, 153, 255, 0.2);
        }

        .project-thumb {
            width: 100%;
            height: 180px;
            background: #14141c;
            object-fit: cover;
        }

        .project-info {
            padding: 20px;
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .project-author {
            font-size: 0.85rem;
            color: #888888;
        }

        .mod-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 10px;
            background: rgba(0, 153, 255, 0.15);
            border: 1px solid rgba(0, 153, 255, 0.3);
            border-radius: 4px;
            font-size: 0.75rem;
            color: #0099ff;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    
    <!-- Shared Header Header -->
    <shared-header></shared-header>

    <main>
        <!-- Matching Main Site Hero -->
        <section class="display-section">
            <div class="display-content">
                <img src="images/favicon.png" alt="Mod Squad Icon" class="hero-favicon">
                <h1 class="display-title">Play & Share</h1>
                <h2 class="display-subtitle">EXPLORE CREATIONS FROM OUR COMMUNITY</h2>
                <a href="#arcade" class="btn-glass">Browse Games</a>
            </div>
        </section>

        <!-- Arcade Project Display Grid -->
        <section class="arcade-section" id="arcade">
            <div class="section-header">
                <p class="section-subtitle">Community Arcade</p>
                <h2 class="section-main-title">Featured Projects</h2>
            </div>

            <div class="arcade-grid">
                <!-- Example Card Placeholder -->
                <div class="project-card">
                    <img src="images/favicon.png" alt="Project Thumbnail" class="project-thumb" style="object-fit: contain; padding: 20px;">
                    <div class="project-info">
                        <h3 class="project-title">Sample Project Title</h3>
                        <p class="project-author">by ModSquadAcademy</p>
                        <span class="mod-badge">TurboWarp</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Shared Footer Footer -->
    <shared-footer></shared-footer>

</body>
</html>
