<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play & Share | Mod Squad Academy</title>
    <meta name="description" content="Play, share, and test projects created with Scratch, TurboWarp, PenguinMod, and Gandi IDE!">
    
    <link rel="icon" type="image/png" href="https://modsquadacademy.com/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <script src="components.js" defer></script>

    <style>
        /* Base Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: #ffffff; background-color: #0b0b12; overflow-x: hidden; }

        /* Force Header to Scratch Blue */
        shared-header { display: block; width: 100%; position: sticky; top: 0; z-index: 1000; }
        .sticky-nav-container { width: 100%; display: flex; flex-direction: column; }
        
        header {
            background-color: #4D97FF !important;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 25px 0;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .logo { margin-left: 10%; margin-right: 50px; display: flex; align-items: center; z-index: 1002; }
        .logo img { height: 38px; width: auto; display: block; filter: brightness(0) invert(1); }

        nav { display: flex; align-items: center; }
        nav ul { display: flex; list-style: none; gap: 22px; align-items: center; }
        nav ul li a { text-decoration: none; color: #ffffff; font-weight: 600; font-size: 15px; opacity: 0.9; }
        nav ul li a:hover, nav ul li a.active { color: #ffe600; opacity: 1; }

        .construction-ribbon {
            background: rgba(0, 0, 0, 0.4);
            color: #ffe600;
            text-align: center;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 230, 0, 0.3);
            width: 100%;
        }

        /* Page Layout Styles */
        .display-section {
            position: relative;
            height: 90vh;
            min-height: 650px;
            background: linear-gradient(rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.15)), url('https://modsquadacademy.com/images/space-bg.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .display-content { max-width: 1100px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .hero-favicon { width: 78px; height: 75px; margin-bottom: 5px; position: relative; top: -50px; }
        .display-title { font-size: 4.2rem; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; }
        .display-subtitle { font-size: 1.5rem; color: #dddddd; margin-bottom: 45px; }

        .arcade-section { padding: 60px 8%; max-width: 1300px; margin: 0 auto; }
        .section-subtitle { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; color: #4D97FF; margin-bottom: 10px; }
        .section-main-title { font-size: 3rem; font-weight: 800; text-transform: uppercase; }

        .arcade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 40px; }
        .project-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; overflow: hidden; text-decoration: none; color: #fff; display: flex; flex-direction: column; }
        .project-thumb { width: 100%; height: 180px; background: #14141c; object-fit: cover; }
        .project-info { padding: 20px; }
        .project-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .project-author { font-size: 0.85rem; color: #888888; }
        .mod-badge { display: inline-block; margin-top: 12px; padding: 4px 10px; background: rgba(77, 151, 255, 0.15); border: 1px solid rgba(77, 151, 255, 0.3); border-radius: 4px; font-size: 0.75rem; color: #4D97FF; font-weight: 600; text-transform: uppercase; }

        .btn-glass { background: rgba(77, 151, 255, 0.3); color: #ffffff; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 16px 36px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 6px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    
    <!-- Manual Header Structure to bypass component loading issues -->
    <div class="sticky-nav-container">
        <header>
            <div class="logo">
                <a href="https://modsquadacademy.com">
                    <img src="https://modsquadacademy.com/images/logo.png" alt="MOD Logo">
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="https://modsquadacademy.com/">Home</a></li>
                    <li><a href="https://modsquadacademy.com/create">Create</a></li>
                    <li><a href="https://modsquadacademy.com/explore">Explore</a></li>
                    <li><a href="https://modsquadacademy.com/featured">Featured</a></li>
                    <li><a href="https://modsquadacademy.com/library">Asset Library</a></li>
                    <li><a href="https://modsquadacademy.com/about">About</a></li>
                    <li><a href="https://modsquadacademy.com/contact">Contact</a></li>
                </ul>
            </nav>
        </header>
        <div class="construction-ribbon">
            ⚠️ WIP ⚠️
        </div>
    </div>

    <main>
        <section class="display-section">
            <div class="display-content">
                <img src="https://modsquadacademy.com/images/favicon.png" alt="Mod Squad Icon" class="hero-favicon">
                <h1 class="display-title">Play & Share</h1>
                <h2 class="display-subtitle">EXPLORE CREATIONS FROM OUR COMMUNITY</h2>
                <a href="#arcade" class="btn-glass">Browse Games</a>
            </div>
        </section>

        <section class="arcade-section" id="arcade">
            <div class="section-header">
                <p class="section-subtitle">Community Arcade</p>
                <h2 class="section-main-title">Featured Projects</h2>
            </div>

            <div class="arcade-grid">
                <div class="project-card">
                    <img src="https://uploads.scratch.mit.edu/projects/thumbnails/414716080.png" alt="Thumbnail" class="project-thumb">
                    <div class="project-info">
                        <h3 class="project-title">Sample Modded Game</h3>
                        <p class="project-author">by ModSquadAcademy</p>
                        <span class="mod-badge">TurboWarp</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <shared-footer></shared-footer>

</body>
</html>
