<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Project - Mod Squad Academy</title>
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="components.js" defer></script>

    <style>
        .player-section {
            padding: 40px 8%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .project-title-header {
            margin-bottom: 25px;
        }

        .title-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 10px;
        }

        .project-main-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }

        .project-author-sub {
            font-size: 1rem;
            color: #aaaaaa;
            margin-top: 5px;
        }

        .platform-badge {
            background: rgba(0, 153, 255, 0.2);
            border: 1px solid rgba(0, 153, 255, 0.5);
            color: #0099ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .player-content-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            align-items: start;
        }

        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #14141c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .player-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .project-details-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 24px;
        }

        .info-card h3 {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0099ff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card p {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .error-container {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .error-container h2 {
            font-size: 2rem;
            color: #ff4d4d;
            margin-bottom: 10px;
        }

        @media (max-width: 900px) {
            .player-section {
                padding: 25px 4%;
            }

            .project-main-title {
                font-size: 1.6rem;
            }

            .player-content-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <shared-header></shared-header>

    <main class="player-section">
        
        <div id="player-view">
            <div class="project-title-header">
                <div class="title-meta-row">
                    <div>
                        <h1 id="project-title" class="project-main-title">Loading Project...</h1>
                        <p id="project-author" class="project-author-sub">by Loading...</p>
                    </div>
                    <span id="platform-badge" class="platform-badge">Detecting...</span>
                </div>
            </div>

            <div class="player-content-grid">
                <div class="player-container">
                    <iframe id="game-player" class="player-iframe" allowtransparency="true" allowfullscreen="true" scrolling="no"></iframe>
                </div>

                <div class="project-details-panel">
                    <div class="info-card">
                        <h3>📋 Instructions</h3>
                        <p id="project-instructions">Loading instructions...</p>
                    </div>

                    <div class="info-card">
                        <h3>💭 Notes and Credits</h3>
                        <p id="project-notes">Loading notes & credits...</p>
                    </div>

                    <div class="actions-bar">
                        <a id="external-link" href="#" target="_blank" class="btn-glass" style="padding: 10px 20px; font-size: 12px;">View Original Source ↗</a>
                    </div>
                </div>
            </div>
        </div>

        <div id="error-view" class="error-container">
            <h2>Invalid Project Request</h2>
            <p style="color: #cccccc; margin-bottom: 25px;">Please provide a valid project parameter, such as:<br><code>projects.html?domain=turbowarp.org&id=811805586</code></p>
            <a href="index.html" class="btn-glass">Return Home</a>
        </div>

    </main>

    <shared-footer></shared-footer>

    <script>
        function parseProjectURL() {
            const path = window.location.pathname;
            const searchParams = new URLSearchParams(window.location.search);
            
            let domain = '';
            let projectId = '';

            if (searchParams.has('domain') && searchParams.has('id')) {
                domain = searchParams.get('domain');
                projectId = searchParams.get('id');
            } else {
                const projectPathIndex = path.indexOf('/projects/');
                if (projectPathIndex !== -1) {
                    const rawParams = path.substring(projectPathIndex + 10).split('/').filter(Boolean);
                    if (rawParams.length >= 2) {
                        domain = rawParams[0].toLowerCase();
                        projectId = rawParams[1];
                    }
                }
            }

            if (!domain || !projectId) {
                showError();
                return;
            }

            loadProject(domain, projectId);
        }

        async function loadProject(domain, projectId) {
            const playerIframe = document.getElementById('game-player');
            const platformBadge = document.getElementById('platform-badge');
            const externalLink = document.getElementById('external-link');

            let platformName = 'TurboWarp';
            let originalUrl = `https://${domain}/${projectId}`;

            // Ensure TurboWarp embeds point cleanly to the scratch ID backend with autoplay turned off
            let embedUrl = `https://turbowarp.org/${projectId}/embed`;

            if (domain.includes('penguinmod.com')) {
                platformName = 'PenguinMod';
                embedUrl = `https://penguinmod.com/embed?id=${projectId}`;
                originalUrl = `https://studio.penguinmod.com/#${projectId}`;
            } else if (domain.includes('snail-ide.com')) {
                platformName = 'Snail IDE';
                embedUrl = `https://snail-ide.com/embed?id=${projectId}`;
                originalUrl = `https://snail-ide.com/#${projectId}`;
            }

            platformBadge.textContent = platformName;
            externalLink.href = originalUrl;
            playerIframe.src = embedUrl;

            // Always fetch metadata from the primary Scratch ID source since TurboWarp/Scratch share project structures
            fetchScratchMetadata(projectId);
        }

        async function fetchScratchMetadata(projectId) {
            const projectTitle = document.getElementById('project-title');
            const projectAuthor = document.getElementById('project-author');
            const projectInstructions = document.getElementById('project-instructions');
            const projectNotes = document.getElementById('project-notes');

            try {
                const response = await fetch(`https://api.scratch.mit.edu/projects/${projectId}`);
                if (!response.ok) throw new Error('API limit or network block.');
                
                const data = await response.json();

                projectTitle.textContent = data.title || `Project #${projectId}`;
                projectAuthor.textContent = `by ${data.author ? data.author.username : 'Unknown Creator'}`;
                projectInstructions.textContent = data.instructions && data.instructions.trim() !== '' 
                    ? data.instructions 
                    : "No instructions provided by the author.";
                projectNotes.textContent = data.description && data.description.trim() !== '' 
                    ? data.description 
                    : "No notes or credits provided by the author.";

            } catch (err) {
                projectTitle.textContent = `Project #${projectId}`;
                projectAuthor.textContent = `Mod Squad Community Creator`;
                projectInstructions.textContent = "Instructions are loaded inside the project environment or original creator page.";
                projectNotes.textContent = "Notes and credits could not be pulled directly due to browser cross-origin rules. Click 'View Original Source' to check details on Scratch.";
            }
        }

        function showError() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('error-view').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', parseProjectURL);
    </script>
</body>
</html>
